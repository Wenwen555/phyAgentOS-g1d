      type: object
    readiness: []
    robot_frame_profile:
      robot_id: g1d
      base_frame: column_origin
      tool_frame: column
      frames: {}
  - tool_id: g1d.perception_state
    implementation_id: unitree.g1d
    endpoint_id: g1d.perception_state
    operation: get
    semantics: query
    description: 'Read the newest frame captured by g1d.perception_session: exactly
      one frame per requested source, and no earlier frames. Every entry carries image_path,
      sha256, sequence, receive time and age_ms measured at read time - compare ages
      to judge how stale a frame is. Each entry also carries changed_since_last_read:
      false means that source''s frame is byte-identical to the one returned by your
      previous successful read, so you have already judged it and can skip the vision
      pass; a first read, a new source and a read after a stale failure all report
      true. Use the native image tool on that path. Each read returns the frame current
      at that moment, so a caller watching for a change has to read again and compare
      its own observations: the store keeps no history and a still is not video -
      never infer a continuous trajectory, speed or direction from two stills. Native
      JPEGs only: no detection, depth or calibrated 3D position, and image pixels
      are not robot target coordinates. Fails when no session has run recently or
      the stored state is older than max_age_ms.'
    input_schema:
      additionalProperties: false
      properties:
        max_age_ms:
          default: 500
          maximum: 1000
          minimum: 1
          title: Max Age Ms
          type: integer
      title: PerceptionStateRequest
      type: object
    output_schema:
      $defs:
        PerceptionFrame:
          additionalProperties: false
          description: 'One captured frame plus whether it differs from the previous
            read''s frame.


            The store keeps no history, so a watcher cannot diff two frames itself
            without

            holding state across calls. This flag compares the frame returned now
            with the

            one this same source returned on the previous successful read, which lets
            a

            caller skip a vision pass on a frame it has already judged. It compares

            ``sha256``, so it is exact: equal digests mean byte-identical content.
            A first

            read, a newly added source, or a read after a stale failure all report
            True.'
          properties:
            source:
              enum:
              - head
              - left_wrist
              - right_wrist
              title: Source
              type: string
            image_path:
              title: Image Path
              type: string
            sha256:
              title: Sha256
              type: string
            sequence:
              minimum: 1
              title: Sequence
              type: integer
            age_ms:
              minimum: 0
              title: Age Ms
              type: number
            width:
              exclusiveMinimum: 0
              title: Width
              type: integer
            height:
              exclusiveMinimum: 0
              title: Height
              type: integer
            binocular:
              title: Binocular
              type: boolean
            mean_brightness:
              maximum: 255
              minimum: 0
              title: Mean Brightness
              type: number
            time_basis:
              const: adapter_receive_monotonic
              default: adapter_receive_monotonic
              title: Time Basis
              type: string
            simulated:
              title: Simulated
              type: boolean
            received_monotonic_s:
              minimum: 0
              title: Received Monotonic S
              type: number
            changed_since_last_read:
              title: Changed Since Last Read
              type: boolean
          required:
          - source
          - image_path
          - sha256
          - sequence
          - age_ms
          - width
          - height
          - binocular
          - mean_brightness
          - simulated
          - received_monotonic_s
          - changed_since_last_read
          title: PerceptionFrame
          type: object
      additionalProperties: false
      properties:
        updated_monotonic_s:
          minimum: 0
          title: Updated Monotonic S
          type: number
        store_age_ms:
          minimum: 0
          title: Store Age Ms
          type: number
        session_active:
          title: Session Active
          type: boolean
        frames:
          items:
            $ref: '#/$defs/PerceptionFrame'
          minItems: 1
          title: Frames
          type: array
        simulated:
          title: Simulated
          type: boolean
        limitations:
          items:
            type: string
          title: Limitations
          type: array
      required:
      - updated_monotonic_s
      - store_age_ms
      - session_active
      - frames
      - simulated
      - limitations
      title: PerceptionStateOutput
      type: object
    readiness: []
    robot_frame_profile:
      robot_id: g1d
      base_frame: column_origin
      tool_frame: column
      frames: {}
  - tool_id: g1d.perception_session
    implementation_id: unitree.g1d
    endpoint_id: g1d.perception_session
    operation: run
    semantics: action
    description: 'Continuously capture native camera JPEGs for the Agent''s own vision
      model, so the robot can report what it currently sees. Runs for duration_s seconds
      (default 30, at most 300) at interval_s cadence (default 0.5), then ends by
      itself; cancel stops it earlier. Choose interval_s from the task: 2.0 for a
      glance, 0.5 to watch a scene, 0.1-0.2 while the arm moves or the moment of contact
      matters, since interval_s is how often the newest frame g1d.perception_state
      returns is replaced. Frames are written to unique content-addressed paths on
      the same host filesystem as the Agent. No detection, tracking, depth or 3D localization
      is performed, and no robot motion is commanded. This Action never judges or
      triggers anything: a placement-watch loop is composed by the Agent polling g1d.perception_state
      and acting on its own vision judgment. Read results with g1d.perception_state;
      progress events report captured frame counts. Pass timeout_ms above duration_s
      (this profile allows up to 330000) or the Gateway deadline caps the run.'
    input_schema:
      additionalProperties: false
      properties:
        sources:
          items:
            enum:
            - head
            - left_wrist
            - right_wrist
            type: string
          maxItems: 3
          minItems: 1
          title: Sources
          type: array
        duration_s:
          default: 30.0
          exclusiveMinimum: 0
          maximum: 300
          title: Duration S
          type: number
        interval_s:
          default: 0.5
          maximum: 2.0
          minimum: 0.1
          title: Interval S
          type: number
        max_age_ms:
          default: 500
          maximum: 1000
          minimum: 1
          title: Max Age Ms
          type: integer
      title: PerceptionSessionRequest
      type: object
    output_schema:
      additionalProperties: false
      properties:
        sources:
          items:
            enum:
            - head
            - left_wrist
            - right_wrist
            type: string
          minItems: 1
          title: Sources
          type: array
        duration_s:
          exclusiveMinimum: 0
          title: Duration S
          type: number
        elapsed_s:
          minimum: 0
          title: Elapsed S
          type: number
        frames_captured:
          additionalProperties:
            type: integer
          title: Frames Captured
          type: object
        last_sequences:
          additionalProperties:
            type: integer
          title: Last Sequences
          type: object
        reason:
          title: Reason
          type: string
        simulated:
          title: Simulated
          type: boolean
        limitations:
          items:
            type: string
          title: Limitations
          type: array
      required:
      - sources
      - duration_s
      - elapsed_s
      - frames_captured
      - last_sequences
      - reason
      - simulated
      - limitations
      title: PerceptionSessionOutput
      type: object
    readiness: []
    robot_frame_profile:
      robot_id: g1d
      base_frame: column_origin
      tool_frame: column
      frames: {}
  - tool_id: g1d.arm_state
    implementation_id: unitree.g1d
    endpoint_id: g1d.arm_state
    operation: get
    semantics: query
    description: Read fresh arm and internal Dex1 encoder angles, references, phase,
      effective duration, torso IMU RPY/age, elbow bend and forearm ground elevation
      in degrees. Radians; reference_held denotes ongoing controller ownership, not
      a brake acknowledgment. Optional joints=[...] returns only those axes so a caller
      stops carrying the full 16-joint pose through its context; freshness is still
      checked over the complete pose. Omit joints for the full detail.
    input_schema:
      additionalProperties: false
      description: 'Arm/Dex1 state request.


        It carries the same freshness bound as `g1d.state`, but its joint names are
        the

        arm''s own axes, which include the two internal Dex1 fingers. Validating against

        the waist/arm joint list instead would reject a request for the very axes
        a grasp

        workflow reads.'
      properties:
        max_age_ms:
          maximum: 1000
          minimum: 1
          title: Max Age Ms
          type: integer
        joints:
          anyOf:
          - items:
              enum:
              - left_shoulder_pitch
              - left_shoulder_roll
              - left_shoulder_yaw
              - left_elbow
              - left_wrist_roll
              - left_wrist_pitch
              - left_wrist_yaw
              - right_shoulder_pitch
              - right_shoulder_roll
              - right_shoulder_yaw
              - right_elbow
              - right_wrist_roll
              - right_wrist_pitch
              - right_wrist_yaw
              - left_dex1
              - right_dex1
              type: string
            maxItems: 16
            type: array
          - type: 'null'
          default: null
          title: Joints
      required:
      - max_age_ms
      title: ArmStateRequest
      type: object
    output_schema:
      $defs:
        ElbowTarget:
          additionalProperties: false
          properties:
            side:
              enum:
              - left
              - right
              title: Side
              type: string
            mode:
              enum:
              - upper_arm
              - world
              title: Mode
              type: string
            angle_deg:
              maximum: 180
              minimum: -90
              title: Angle Deg
              type: number
          required:
          - side
          - mode
          - angle_deg
          title: ElbowTarget
          type: object
        JointTarget:
          additionalProperties: false
          properties:
            joint:
              enum:
              - left_shoulder_pitch
              - left_shoulder_roll
              - left_shoulder_yaw
              - left_elbow
              - left_wrist_roll
              - left_wrist_pitch
              - left_wrist_yaw
              - right_shoulder_pitch
              - right_shoulder_roll
              - right_shoulder_yaw
              - right_elbow
              - right_wrist_roll
              - right_wrist_pitch
              - right_wrist_yaw
              - left_dex1
              - right_dex1
              title: Joint
              type: string
            position_rad:
              title: Position Rad
              type: number
          required:
          - joint
          - position_rad
          title: JointTarget
          type: object
      additionalProperties: false
      properties:
        positions_rad:
          additionalProperties:
            type: number
          title: Positions Rad
          type: object
        references_rad:
          additionalProperties:
            type: number
          title: References Rad
          type: object
        age_s:
          title: Age S
          type: number
        phase:
          title: Phase
          type: string
        effective_duration_s:
          title: Effective Duration S
          type: number
        simulated:
          title: Simulated
          type: boolean
        reference_held:
          title: Reference Held
          type: boolean
        torso_rpy_rad:
          anyOf:
          - maxItems: 3
            minItems: 3
            prefixItems:
            - type: number
            - type: number
            - type: number
            type: array
          - type: 'null'
          default: null
          title: Torso Rpy Rad
        torso_age_s:
          default: -1.0
          title: Torso Age S
          type: number
        elbow_bend_deg:
          additionalProperties:
            type: number
          title: Elbow Bend Deg
          type: object
        forearm_world_elevation_deg:
          additionalProperties:
            type: number
          title: Forearm World Elevation Deg
          type: object
        requested_elbows:
          items:
            $ref: '#/$defs/ElbowTarget'
          title: Requested Elbows
          type: array
        resolved_targets:
          items:
            $ref: '#/$defs/JointTarget'
          title: Resolved Targets
          type: array
      required:
      - positions_rad
      - references_rad
      - age_s
      - phase
      - effective_duration_s
      - simulated
      - reference_held
      title: ArmOutput
      type: object
    readiness: []
    robot_frame_profile:
      robot_id: g1d
      base_frame: torso
      tool_frame: joint_encoder
      frames: {}
  - tool_id: g1d.move_joints
    implementation_id: unitree.g1d
    endpoint_id: g1d.arm
    operation: move
    semantics: action
    description: 'Move raw targets to encoder radians, or use elbows=[{side,mode,angle_deg}].
      upper_arm bend: straight=0, bent=90 degrees. world forearm elevation: down=-90,
      horizontal=0, up=90 degrees; uses fresh torso IMU and measured 3D shoulder pose.
      Move the shoulder in an earlier Action only for world-mode elbows; upper_arm-mode
      elbows are independent of the shoulder and belong in the same request as it.
      Unreachable angles are rejected; world mode is a one-shot elevation target,
      not persistent stabilization or Cartesian IK. Quintic trajectory; unspecified
      joints retain their last references. Batch every joint that can move together
      into one request: a single call applies one trajectory and one settling window
      to the whole set, so a whole pose costs one Action instead of a chain of single-joint
      steps. Visual elbow bend 90 degrees means elbow encoder 0 in upper_arm mode,
      irrespective of shoulder pitch, and does not mean the forearm must stay world-horizontal;
      a hanging elbow is pi/2. Left wrist roll is rotation about forearm axis. Internal
      left/right Dex1 are motors 31/33: 0 closed; the open target is the operator-confirmed
      finger travel inside the application envelope below, because the vendor mapping
      constant 5.4 can exceed the real finger travel and an unreachable target stalls
      without failing. Shoulder/elbow/Dex1 tolerance 0.15 rad; wrist joints 0.08.
      Controller holds after completion. Cancel freezes reference, not reverse recovery
      or proof of physical stopping. Application envelopes: {''left_shoulder_pitch'':
      (-1.5707963267948966, 1.5707963267948966), ''left_shoulder_roll'': (-0.2, 1.2),
      ''left_shoulder_yaw'': (-0.5, 0.5), ''left_elbow'': (-0.2, 2.0), ''left_wrist_roll'':
