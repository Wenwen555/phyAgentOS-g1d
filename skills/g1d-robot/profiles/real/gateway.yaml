  - tool_id: g1d.grasp_target
    implementation_id: unitree.g1d
    endpoint_id: g1d.grasp
    operation: execute
    semantics: action
    description: 'Open, close or release the selected internal Dex1 for a user-aligned
      object. Required side=left|right follows the current prompt. operation=open
      opens only the selected Dex1 to the operator-confirmed finger travel and holds
      until a separate close instruction; this tool never schedules an automatic close,
      and a user placement is not a close instruction on its own. operation=close
      closes towards 0 while watching the encoder: a finger stopped by an object settles
      above the confirmed empty-close rest position, and that stall is reported as
      contact_detected with the measured blockage_rad, after which the fingers are
      held at the stall angle instead of pressing on - that held angle is the confirmed
      grasp angle. fully_closed means the fingers reached the empty-close rest position:
      the encoder saw no object in the way, which is inconclusive for a thin or compliant
      object. operation=release opens to the same travel, then closes again by itself,
      so the gripper is never left open after letting an object go: it reports released_then_closed
      when the fingers came back to the closed rest position and contact_detected
      when something - typically the object - is still between them. Visual verifier
      is disabled: no before_observation_id, image capture, model calls or visual
      gate. Returns mechanical_outcome and verification_status=disabled, grasp_verified=false;
      contact_detected is mechanical evidence, not proof that the intended object
      is held. Independent observation remains available when requested. No arm approach
      or IK. Holds after completion/cancel. Shares exclusive arm control and retains
      feedback freshness, speed limits and deadlines.'
    input_schema:
      additionalProperties: false
      properties:
        side:
          enum:
          - left
          - right
          title: Side
          type: string
        operation:
          enum:
          - open
