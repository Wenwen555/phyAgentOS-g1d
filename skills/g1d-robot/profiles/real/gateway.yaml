  - tool_id: g1d.observe
    implementation_id: unitree.g1d
    endpoint_id: g1d.observe
    operation: get
    semantics: query
    description: 'Read-only observation bundle: requested camera JPEGs plus fresh
      arm/Dex1 state and torso IMU. Returns immutable observation_id/manifest_path,
      image paths/hashes, ages and conservative host receive-time skew. sources defaults
      to [head]; max_age_ms=500, max_skew_ms=100. All requested sources must be fresh
      and sufficiently aligned. Best-effort receive-time association, not synchronized
      sensor capture. No detection, depth or calibrated 3D positions. No column-height
      prerequisite.'
    input_schema:
      additionalProperties: false
      properties:
        sources:
          items:
            enum:
            - head
            - left_wrist
            - right_wrist
            type: string
          maxItems: 3
          minItems: 1
          title: Sources
          type: array
        max_age_ms:
          default: 500
          maximum: 1000
          minimum: 1
          title: Max Age Ms
          type: integer
        max_skew_ms:
          default: 100
          maximum: 1000
          minimum: 1
          title: Max Skew Ms
          type: integer
      title: ObserveRequest
      type: object
    output_schema:
      $defs:
        ArmOutput:
          additionalProperties: false
          properties:
            positions_rad:
              additionalProperties:
                type: number
              title: Positions Rad
              type: object
            references_rad:
              additionalProperties:
                type: number
              title: References Rad
              type: object
            age_s:
              title: Age S
              type: number
            phase:
              title: Phase
              type: string
            effective_duration_s:
              title: Effective Duration S
              type: number
            simulated:
              title: Simulated
              type: boolean
            reference_held:
              title: Reference Held
              type: boolean
            torso_rpy_rad:
              anyOf:
              - maxItems: 3
                minItems: 3
                prefixItems:
                - type: number
                - type: number
                - type: number
                type: array
              - type: 'null'
              default: null
              title: Torso Rpy Rad
            torso_age_s:
              default: -1.0
              title: Torso Age S
              type: number
            elbow_bend_deg:
              additionalProperties:
                type: number
              title: Elbow Bend Deg
              type: object
            forearm_world_elevation_deg:
              additionalProperties:
                type: number
              title: Forearm World Elevation Deg
              type: object
            requested_elbows:
              items:
                $ref: '#/$defs/ElbowTarget'
              title: Requested Elbows
              type: array
            resolved_targets:
              items:
                $ref: '#/$defs/JointTarget'
              title: Resolved Targets
              type: array
          required:
          - positions_rad
          - references_rad
          - age_s
          - phase
          - effective_duration_s
          - simulated
          - reference_held
          title: ArmOutput
          type: object
        ElbowTarget:
          additionalProperties: false
          properties:
            side:
              enum:
              - left
              - right
              title: Side
              type: string
            mode:
              enum:
              - upper_arm
              - world
              title: Mode
              type: string
            angle_deg:
              maximum: 180
              minimum: -90
              title: Angle Deg
              type: number
          required:
          - side
          - mode
          - angle_deg
          title: ElbowTarget
          type: object
        JointTarget:
          additionalProperties: false
          properties:
            joint:
              enum:
              - left_shoulder_pitch
              - left_shoulder_roll
              - left_shoulder_yaw
              - left_elbow
              - left_wrist_roll
              - left_wrist_pitch
              - left_wrist_yaw
              - right_shoulder_pitch
              - right_shoulder_roll
              - right_shoulder_yaw
              - right_elbow
              - right_wrist_roll
              - right_wrist_pitch
              - right_wrist_yaw
              - left_dex1
              - right_dex1
              title: Joint
              type: string
            position_rad:
              title: Position Rad
              type: number
          required:
          - joint
          - position_rad
          title: JointTarget
          type: object
        ObservedImage:
          additionalProperties: false
          properties:
            source:
              enum:
              - head
              - left_wrist
              - right_wrist
              title: Source
              type: string
            image_path:
              title: Image Path
              type: string
            sha256:
              title: Sha256
              type: string
            sequence:
              minimum: 1
              title: Sequence
              type: integer
            age_ms:
              minimum: 0
              title: Age Ms
              type: number
            width:
              exclusiveMinimum: 0
              title: Width
              type: integer
            height:
              exclusiveMinimum: 0
              title: Height
              type: integer
            binocular:
              title: Binocular
              type: boolean
            mean_brightness:
              maximum: 255
              minimum: 0
              title: Mean Brightness
              type: number
            time_basis:
              const: adapter_receive_monotonic
              default: adapter_receive_monotonic
              title: Time Basis
