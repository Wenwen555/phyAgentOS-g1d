[project]
name = "paos-g1d"
version = "0.1.0"
description = "G1-D device endpoints for the native PhyAgentOS Forge runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
  "dora-rs==0.4.1",
  "forge-msgs==1.0.1",
  "pyzmq>=26,<28",
  "pillow>=12.3,<13",
  "PyYAML>=6,<7",
  "pydantic>=2.12,<3",
  "jsonschema>=4.23,<5",
]

[dependency-groups]
dev = [
  "pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff", "pyinstaller",
  "httpx>=0.28,<1", "fastapi>=0.141.1,<1", "uvicorn>=0.30,<1",
  "pydantic-settings>=2.12,<3", "loguru>=0.7,<1",
  "websockets>=16,<17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", ".deps/forge-gateway/src", "../PhyAgentOS-core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
